name: Check Rust Release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for new Rust release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RUST=$(curl -sf https://static.rust-lang.org/dist/channel-rust-stable.toml | awk '/^\[pkg.rustc\]/{f=1} f && /^version = /{gsub(/version = "/,""); gsub(/ .*/,""); print; exit}')
          if [ -z "${LATEST_RUST}" ]; then
            echo "::error::Failed to fetch latest Rust version"
            exit 1
          fi
          echo "Latest Rust version: ${LATEST_RUST}"

          TAG="v${LATEST_RUST}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, nothing to do."
            exit 0
          fi

          echo "New Rust version detected, creating tag ${TAG}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          gh workflow run release.yml --ref "${TAG}"