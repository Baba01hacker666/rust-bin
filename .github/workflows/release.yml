name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { rust: "x86_64-unknown-linux-gnu", wheel: "manylinux_2_17_x86_64", llvm: true }
          - { rust: "aarch64-unknown-linux-gnu", wheel: "manylinux_2_17_aarch64", llvm: true }
          - { rust: "i686-unknown-linux-gnu", wheel: "manylinux_2_17_i686", llvm: false }
          - { rust: "x86_64-unknown-linux-musl", wheel: "musllinux_1_2_x86_64", llvm: false }
          - { rust: "x86_64-pc-windows-msvc", wheel: "win_amd64", llvm: false }
          - { rust: "aarch64-pc-windows-msvc", wheel: "win_arm64", llvm: false }
          - { rust: "x86_64-apple-darwin", wheel: "macosx_10_9_x86_64", llvm: true }
          - { rust: "aarch64-apple-darwin", wheel: "macosx_11_0_arm64", llvm: true }
        part:
          - { name: "main", path: "." }
          - { name: "llvm", path: "packages/rustc-bin-llvm" }
          - { name: "driver", path: "packages/rustc-bin-driver" }
          - { name: "lld", path: "packages/rustc-bin-lld" }
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - if: ${{ matrix.part.name != 'llvm' || matrix.target.llvm }}
        env:
          RUST_PART: ${{ matrix.part.name }}
          RUST_TARGET: ${{ matrix.target.rust }}
          WHEEL_TAG: ${{ matrix.target.wheel }}
        run: |
          cd "${{ matrix.part.path }}"
          RUST_PART="$RUST_PART" \
          RUST_TARGET="$RUST_TARGET" \
          WHEEL_TAG="$WHEEL_TAG" \
          uv build --wheel
      - if: ${{ matrix.part.name != 'llvm' || matrix.target.llvm }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.part.name }}-${{ matrix.target.rust }}
          path: ${{ matrix.part.path }}/dist/*.whl
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: uv publish --check-url https://pypi.org/simple/ dist/*