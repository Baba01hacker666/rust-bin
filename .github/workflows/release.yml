name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Packaging version when dispatching manually (e.g. 1.100.0.post2)"
        required: false
        default: ""
      publish:
        description: "Which project to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - llvm
          - compiler
          - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { rust: "x86_64-unknown-linux-gnu", wheel: "manylinux_2_17_x86_64", llvm: true }
          - { rust: "aarch64-unknown-linux-gnu", wheel: "manylinux_2_17_aarch64", llvm: true }
          - { rust: "i686-unknown-linux-gnu", wheel: "manylinux_2_17_i686", llvm: false }
          - { rust: "x86_64-unknown-linux-musl", wheel: "musllinux_1_2_x86_64", llvm: false }
          - { rust: "x86_64-pc-windows-msvc", wheel: "win_amd64", llvm: false }
          - { rust: "aarch64-pc-windows-msvc", wheel: "win_arm64", llvm: false }
          - { rust: "x86_64-apple-darwin", wheel: "macosx_10_9_x86_64", llvm: true }
          - { rust: "aarch64-apple-darwin", wheel: "macosx_11_0_arm64", llvm: true }
        part:
          - { name: "main", path: "." }
          - { name: "llvm", path: "packages/rustc-bin-llvm" }
          - { name: "driver", path: "packages/rustc-bin-driver" }
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - if: ${{ matrix.part.name != 'llvm' || matrix.target.llvm }}
        env:
          RUST_PART: ${{ matrix.part.name }}
          RUST_TARGET: ${{ matrix.target.rust }}
          WHEEL_TAG: ${{ matrix.target.wheel }}
          RUST_REF_NAME: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          cd "${{ matrix.part.path }}"
          RUST_PART="$RUST_PART" \
          RUST_TARGET="$RUST_TARGET" \
          WHEEL_TAG="$WHEEL_TAG" \
          RUST_REF_NAME="$RUST_REF_NAME" \
          uv build --wheel
      - if: ${{ matrix.part.name != 'llvm' || matrix.target.llvm }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.part.name }}-${{ matrix.target.rust }}
          path: ${{ matrix.part.path }}/dist/*.whl
          if-no-files-found: error
  # PyPI keys a pending publisher on (owner, repository, workflow, environment)
  # and ignores the project name, so every project published from this repo
  # needs its own job with its own GitHub environment. rustc-bin already has a
  # publisher without an environment, so that job deliberately has none.
  # Publish the companions first: rustc-bin declares them as dependencies, so
  # it must not land before they exist on PyPI.
  publish-main:
    if: ${{ inputs.publish == '' || inputs.publish == 'all' || inputs.publish == 'main' }}
    needs: [build, publish-llvm, publish-compiler]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-main-*
          path: dist
          merge-multiple: true
      - run: uv publish --check-url https://pypi.org/simple/ dist/*.whl
  publish-llvm:
    if: ${{ inputs.publish == '' || inputs.publish == 'all' || inputs.publish == 'llvm' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-llvm
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-llvm-*
          path: dist
          merge-multiple: true
      - run: uv publish --check-url https://pypi.org/simple/ dist/*.whl
  publish-compiler:
    if: ${{ inputs.publish == '' || inputs.publish == 'all' || inputs.publish == 'compiler' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-driver
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-driver-*
          path: dist
          merge-multiple: true
      - run: uv publish --check-url https://pypi.org/simple/ dist/*.whl